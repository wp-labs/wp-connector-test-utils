[package]
name = "wp-connector-test-utils"
version = "0.2.3" #@gxl:set(version)
edition = "2024"
description = "Shared test infrastructure for wp-connectors and wp-connectors-labs"
authors = ["WP Labs Team"]
license = "Apache-2.0"
repository = "https://github.com/wp-labs/wp-connector-test-utils"

[dependencies]
wp-connector-api = "0.11"
wp-model-core = "0.8"
orion-error = "0.8"
derive_more = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
rand = "0.10"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
chrono = "0.4"
